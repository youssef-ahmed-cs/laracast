server {
    listen 80;
    listen [::]:80;

    server_name 20.203.144.86;

    root /var/www/html/laravel-app/public;
    index index.php;

    charset utf-8;

    # Maximum upload size
    client_max_body_size 50M;

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM - Laravel front controller
    location = /index.php {
        include fastcgi_params;

        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PATH_INFO "";
    }

    # Block direct PHP execution
    location ~ \.php$ {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Protect sensitive Laravel files
    location ~* ^/(?:\.env|composer\.(?:json|lock)|artisan|server\.php|phpunit\.xml|README\.md) {
        deny all;
    }

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        log_not_found off;
    }

    # Disable access logs for favicon and robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Error handling
    error_page 404 /index.php;
}